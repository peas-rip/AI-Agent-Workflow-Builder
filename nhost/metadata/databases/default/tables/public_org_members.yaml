table:
  name: org_members
  schema: public
object_relationships:
  - name: organization
    using:
      manual_configuration:
        column_mapping:
          org_id: id
        insertion_order: null
        remote_table:
          name: organizations
          schema: public
  - name: user
    using:
      manual_configuration:
        column_mapping:
          user_id: id
        insertion_order: null
        remote_table:
          name: users
          schema: auth
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - user_id
        - org_id
        - role
        - created_at
      filter:
        org_id:
          _in: X-Hasura-Org-Ids
