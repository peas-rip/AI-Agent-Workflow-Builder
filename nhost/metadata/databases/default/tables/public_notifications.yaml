table:
  name: notifications
  schema: public
object_relationships:
  - name: workflow_run
    using:
      manual_configuration:
        column_mapping:
          workflow_run_id: id
        insertion_order: null
        remote_table:
          name: workflow_runs
          schema: public
insert_permissions:
  - role: user
    permission:
      check: {}
      columns:
        - id
        - workflow_run_id
        - channel
        - message
        - webhook_url
        - sent_at
        - status
    comment: ""
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - workflow_run_id
        - channel
        - message
        - webhook_url
        - sent_at
        - status
      filter: {}
      allow_aggregations: true
update_permissions:
  - role: user
    permission:
      columns:
        - id
        - workflow_run_id
        - channel
        - message
        - webhook_url
        - sent_at
        - status
      filter: {}
      check: {}
    comment: ""
delete_permissions:
  - role: user
    permission:
      filter: {}
    comment: ""
