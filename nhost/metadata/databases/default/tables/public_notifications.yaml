table:
  name: notifications
  schema: public
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - workflow_run_id
        - channel
        - message
        - webhook_url
        - sent_at
        - status
      filter:
        workflow_run:
          workflow:
            org_id:
              _in: X-Hasura-Org-Ids
