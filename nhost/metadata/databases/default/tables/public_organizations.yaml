table:
  name: organizations
  schema: public
array_relationships:
  - name: org_members
    using:
      manual_configuration:
        column_mapping:
          id: org_id
        insertion_order: null
        remote_table:
          name: org_members
          schema: public
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - name
        - usage_calls_used
        - usage_calls_allowed
        - usage_period_start
        - created_at
      filter:
        id:
          _in: X-Hasura-Org-Ids
