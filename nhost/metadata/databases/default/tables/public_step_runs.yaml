table:
  name: step_runs
  schema: public
object_relationships:
  - name: workflow_run
    using:
      manual_configuration:
        column_mapping:
          workflow_run_id: id
        insertion_order: null
        remote_table:
          name: workflow_runs
          schema: public
  - name: workflow_step
    using:
      manual_configuration:
        column_mapping:
          workflow_step_id: id
        insertion_order: null
        remote_table:
          name: workflow_steps
          schema: public
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - workflow_run_id
        - workflow_step_id
        - status
        - input
        - output
        - error_message
        - attempt_count
        - approved_by
        - approved_at
        - started_at
        - completed_at
      filter:
        workflow_run:
          workflow:
            org_id:
              _in: X-Hasura-Org-Ids
