table:
  name: workflow_steps
  schema: public
object_relationships:
  - name: workflow
    using:
      manual_configuration:
        column_mapping:
          workflow_id: id
        insertion_order: null
        remote_table:
          name: workflows
          schema: public
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - workflow_id
        - step_order
        - step_type
        - config
        - created_at
      filter:
        workflow:
          org_id:
            _in: X-Hasura-Org-Ids
