table:
  name: workflow_triggers
  schema: public
object_relationships:
  - name: workflow
    using:
      manual_configuration:
        column_mapping:
          workflow_id: id
        insertion_order: null
        remote_table:
          name: workflows
          schema: public
insert_permissions:
  - role: user
    permission:
      check: {}
      columns:
        - id
        - workflow_id
        - trigger_type
        - config
        - is_active
        - webhook_secret
        - created_at
    comment: ""
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - workflow_id
        - trigger_type
        - config
        - is_active
        - webhook_secret
        - created_at
      filter: {}
      allow_aggregations: true
update_permissions:
  - role: user
    permission:
      columns:
        - id
        - workflow_id
        - trigger_type
        - config
        - is_active
        - webhook_secret
        - created_at
      filter: {}
      check: {}
    comment: ""
delete_permissions:
  - role: user
    permission:
      filter: {}
    comment: ""
