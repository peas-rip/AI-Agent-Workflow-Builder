actions:
  - name: triggerWorkflowRun
    definition:
      kind: synchronous
      handler: "{{NHOST_FUNCTIONS_URL}}/actions"
      headers:
        - name: x-hasura-action-secret
          value_from_env: ACTION_SECRET
    type: triggerWorkflowRun
    arguments:
      - name: workflow_id
        type: uuid!
    output_type: TriggerWorkflowRunResponse
    headers:
      - name: x-hasura-action-secret
        value_from_env: ACTION_SECRET

  - name: approveStep
    definition:
      kind: synchronous
      handler: "{{NHOST_FUNCTIONS_URL}}/actions"
      headers:
        - name: x-hasura-action-secret
          value_from_env: ACTION_SECRET
    type: approveStep
    arguments:
      - name: step_run_id
        type: uuid!
      - name: approved
        type: Boolean!
    output_type: ApproveStepResponse
    headers:
      - name: x-hasura-action-secret
        value_from_env: ACTION_SECRET

custom_types:
  input_objects: []
  objects:
    - name: TriggerWorkflowRunResponse
      fields:
        - name: workflow_run_id
          type: uuid!
        - name: status
          type: String!
    - name: ApproveStepResponse
      fields:
        - name: success
          type: Boolean!
        - name: status
          type: String!
  scalars: []
  enums: []

event_triggers:
  - name: db_event_trigger
    table:
      schema: public
      name: your_table_name
    delivery:
      webhook: "{{NHOST_FUNCTIONS_URL}}/events/dbEvent"
      retry_conf:
        num_retries: 3
        interval_sec: 10
        timeout_sec: 60
      headers:
        - name: x-hasura-event-secret
          value_from_env: EVENT_SECRET
    enable_manual: false
    update:
      columns: "*"

cron_triggers:
  - name: scheduled_workflow_trigger
    webhook: "{{NHOST_FUNCTIONS_URL}}/scheduled/cron"
    schedule: "0 9 * * *"
    payload: {}
    include_in_metadata: true
    headers:
      - name: x-hasura-cron-secret
        value_from_env: CRON_SECRET
