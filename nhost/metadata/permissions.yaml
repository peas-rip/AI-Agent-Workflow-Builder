permissions:
  organizations:
    - role: owner
      permission:
        columns: "*"
        filter:
          org_members:
            user_id: { _eq: "X-Hasura-User-Id" }
            role: { _eq: "owner" }
    - role: editor
      permission:
        columns: "*"
        filter:
          org_members:
            user_id: { _eq: "X-Hasura-User-Id" }
            role: { _in: ["owner", "editor"] }
    - role: viewer
      permission:
        columns: "*"
        filter:
          org_members:
            user_id: { _eq: "X-Hasura-User-Id" }
            role: { _in: ["owner", "editor", "viewer"] }

  org_members:
    - role: owner
      permission:
        columns: "*"
        filter:
