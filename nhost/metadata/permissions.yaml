# Step-level gating permissions (Layer 2)
# Only owners can insert dangerous step types
workflow_steps_insert_permissions:
  - role: owner
    permission:
      columns: "*"
      check: {}
  - role: editor
    permission:
      columns: "*"
      check:
        step_type: { _in: ["llm_call", "http_request", "conditional_branch", "approval_gate"] }
  # Viewers cannot insert
